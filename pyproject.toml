[project]
name = "nam-horosho-vmeste-bot"
version = "0.1.0"
description = "Telegram compatibility bot for the 'Nam khorosho vmeste' model"
authors = [
  { name = "AI Assistant" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.4.1,<4.0.0",
  "pydantic>=2.6.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "orjson>=3.9.10",
  "httpx>=0.27.0,<0.28.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<0.24.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0"
]

[tool.aiogram-cli]
entrypoint = "bot.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
